    function normalizeName(str) {
        return (str || "").replace(/[\s\-\(\)·]/g, "");
    }

    function getTodayString() {
        var now = new Date();
        var y = now.getFullYear();
        var m = String(now.getMonth() + 1).padStart(2, '0');
        var d = String(now.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }
    var todayStr = getTodayString();

    // [현재 시점 기준 정확히 4년 전 기준일 계산]
    function getFourYearsAgoString() {
        var now = new Date();
        now.setFullYear(now.getFullYear() - 4);
        var y = now.getFullYear();
        var m = String(now.getMonth() + 1).padStart(2, '0');
        var d = String(now.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }
    var fourYearsAgoStr = getFourYearsAgoString();

    function isWithinFourYears(apt) {
        var refDate = apt.CNTRCT_CNCLS_ENDDE || apt.RCEPT_ENDDE || apt.RCRIT_PBLANC_DE || "";
        if (!refDate || refDate === "-") return true;
        return refDate >= fourYearsAgoStr;
    }

    function matchRegion(addr, regionType) {
        if (regionType === 'national') return true;
        if (!addr) return false;

        if (regionType === 'busan') {
            return clean.indexOf("부산") === 0 ||

                   clean.indexOf("양산") !== -1 ||
                   clean.indexOf("진주") !== -1 ||
                   clean.indexOf("통영") !== -1 ||
                   clean.indexOf("사천") !== -1 ||
                   clean.indexOf("밀양") !== -1;
        }

        if (regionType === 'seoul') {
            return clean.indexOf("서울") === 0 ||
                   clean.indexOf("인천") === 0 ||
                   clean.indexOf("경기도") === 0 ||
                   clean.indexOf("경기 ") === 0;
        }

        return true;
    }

    function applyFilters() {
        var visibleCount = 0;
        allMarkerItems.forEach(function(item) {
            var regionMatch = matchRegion(item.addr, currentRegion);
            var typeMatch = (currentFilter === 'all') ||
                            (currentFilter === 'fcfs' && item.isFcfs) ||
                            (currentFilter === 'apt' && !item.isFcfs);

            var shouldShow = regionMatch && typeMatch;
            item.marker.setMap(shouldShow ? map : null);
            item.overlay.setMap(shouldShow ? map : null);

            if (shouldShow) visibleCount++;
        });

        var regionLabel = currentRegion === 'busan' ? '부산·경남'
                        : currentRegion === 'seoul' ? '수도권'
                        : '전국';

        if (loadedCount < totalTargetCount) {
            document.getElementById('status').innerText = regionLabel + " (4년이내): " + visibleCount + "곳 (로딩 중...)";
        } else {
            document.getElementById('status').innerText = regionLabel + " (4년이내): " + visibleCount + "곳";
        }
    }

    function moveToRegion(type, element) {
        currentRegion = type;
        document.querySelectorAll('.btn-region').forEach(function(btn) {
            btn.classList.remove('active');
        });
        element.classList.add('active');

        if (type === 'busan') {
            map.setLevel(8);
            map.panTo(new kakao.maps.LatLng(35.1795543, 129.0756416));
        } else if (type === 'national') {
            map.setLevel(12);
            map.panTo(new kakao.maps.LatLng(36.3504, 127.3845));
        } else if (type === 'seoul') {
            map.setLevel(9);
            map.panTo(new kakao.maps.LatLng(37.5665, 126.9780));
        }

        applyFilters();
    }

    function filterMarkers(filterType, element) {
        currentFilter = filterType;
        document.querySelectorAll('.btn-filter').forEach(function(btn) {
            btn.classList.remove('active');
        });
        element.classList.add('active');

        applyFilters();
    }

    function getAptStatus(contractEndStr) {
        if (!contractEndStr || contractEndStr >= todayStr) return 'apt';
        var today = new Date(todayStr);
        var endDate = new Date(contractEndStr);
        var diffDays = (today - endDate) / (1000 * 60 * 60 * 24);
        if (diffDays <= 365) return 'fcfs';
        if (diffDays < 1095) return 'check';
        return 'old';
    }

    function cleanAddress(rawAddr) {
        if (!rawAddr) return "";
        return rawAddr
            .replace(/\(.*?\)/g, '')
            .replace(/외\s*\d+.*$/g, '')
            .replace(/일원.*$/g, '')
            .replace(/[\d\-]+BL.*$/gi, '')
            .replace(/BL.*$/gi, '')
            .replace(/로트.*$/gi, '')
            .trim();
    }

    var sheetManagers = [];
    var SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS9i0XauGTtL6JWFSjKx0trX6LAnw-_hvb6LV3YEe1RKWnZLSxyi2szhaYaHyrSqDj5rwdIZLuO53Vt/pub?gid=0&single=true&output=csv";

    fetch(SHEET_CSV_URL)
        .then(function(res) { return res.text(); })
        .then(function(csvText) {
            var lines = csvText.split(/\r?\n/);
            for (var i = 1; i < lines.length; i++) {
                var cols = lines[i].split(",");
                if (cols.length >= 6) {
                    var keyword = (cols[0] || "").replace(/^"|"$/g, "").trim();
                    var role = (cols[1] || "").replace(/^"|"$/g, "").trim();
                    var managerName = (cols[2] || "").replace(/^"|"$/g, "").trim();
                    var phone = (cols[3] || "").replace(/^"|"$/g, "").trim();
                    var kakao = (cols[4] || "").replace(/^"|"$/g, "").trim();
                    var status = (cols[5] || "").replace(/^"|"$/g, "").trim().toUpperCase();
                    var endDate = (cols[6] || "").replace(/^"|"$/g, "").trim();
                    if (keyword && status === "ON") {
                        sheetManagers.push({
                            keyword: keyword,
                            role: role,
                            managerName: managerName,
                            phone: phone,
                            kakao: kakao,
                            endDate: endDate
                        });
                    }
                }
            }
        })
        .catch(function(err) { console.log("담당자 시트 로드 대기:", err); });

    function getAssignedManager(aptName) {
        var today = new Date().toISOString().slice(0, 10);
        for (var i = 0; i < sheetManagers.length; i++) {
            var m = sheetManagers[i];
            if (aptName.indexOf(m.keyword) !== -1) {
                if (m.endDate && m.endDate < today) continue;
                return m;
            }
        }
        return null;
    }

    function openModal(apt, statusType) {
        var modalOverlay = document.getElementById('modalOverlay');
        var modalBody = document.getElementById('modalBody');

        var name = apt.HOUSE_NM || "단지명 미제공";
        var addr = apt.HSSPLY_ADRES || "주소 정보 없음";
        var scale = apt.TOT_SUPLY_HSHLDCO ? (apt.TOT_SUPLY_HSHLDCO + " 세대") : "-";
        var rceptStart = apt.RCEPT_BGNDE || "-";
        var rceptEnd = apt.RCEPT_ENDDE || "-";
        var winDate = apt.PRZWNER_PRESN_DATE || "-";
        var contractStart = apt.CNTRCT_CNCLS_BGNDE || "-";
        var contractEnd = apt.CNTRCT_CNCLS_ENDDE || "-";
        var construct = apt.BSNS_MBY_NM || apt.CNSTRCT_ENTRPS_NM || "-";
        var url = apt.PBLANC_URL || "";

        var statusBadge = statusType === 'apt'
            ? `<span class="badge badge-apt">실시간 청약 일정 진행중</span>`
            : statusType === 'old'
            ? `<span class="badge badge-old">입주완료 · 잔여세대 및 매물/전월세 상담</span>`
            : `<span class="badge badge-fcfs">정당계약 종료 (선착순 동호수 지정·상담)</span>`;

        var checkPoints = statusType === 'apt'
            ? `<li><strong>청약 자격 사전 점검:</strong> 모집공고일 기준 해당 지역 거주기간, 예치금 충족 여부 및 세대주 요건 확인</li>
               <li><strong>가점제·추첨제 비율:</strong> 전용면적별 가점제/추첨제 당첨 비율 및 생애최초·신혼부부 특별공급 중복 청약 여부 체크</li>
               <li><strong>계약금 및 대출 한도:</strong> 당첨자 발표 후 정당계약일까지 초기 계약금(10%) 마련 및 중도금 대출 가능 여부 확인</li>`
            : statusType === 'old'
            ? `<li><strong>입주 후 매매·전월세 시세:</strong> 단지 내 실거래가 추이, 동·층별 로열동 매물 현황 및 전세가율 비교 점검</li>
               <li><strong>등기·권리관계 분석:</strong> 소유권이전등기 완료 여부, 근저당권 설정 내역 및 전세보증보험 가입 요건 확인</li>
               <li><strong>잔여 회사보유분 체크:</strong> 일부 단지의 경우 준공 후 미분양·회사보유분 특별조건 분양 물량 유무 별도 확인 가능</li>`
            : `<li><strong>청약통장 불필요:</strong> 만 19세 이상이면 거주지·주택수 무관하게 잔여 동·호수 선착순 지정 계약 가능</li>
               <li><strong>계약 조건 및 혜택 확인:</strong> 계약금 정액제, 중도금 무이자·후불제 조건 및 발코니 확장비 포함 여부 필수 체크</li>
               <li><strong>권리·전매 체크:</strong> 전매제한 기간, 실거주 의무 유무 및 입주 시점 자금 조달 계획 사전 점검 권장</li>`;

        var html = `
            <div style="margin-bottom: 6px;">${statusBadge}</div>
            <div class="modal-title">${name}</div>
            <table class="modal-table">
                <tr><th>공급위치</th><td>${addr}</td></tr>
                <tr><th>공급규모</th><td>${scale}</td></tr>
                <tr><th>청약접수</th><td>${rceptStart} ~ ${rceptEnd}</td></tr>
                <tr><th>당첨자발표</th><td>${winDate}</td></tr>
                <tr><th>정당계약일</th><td><strong>${contractStart} ~ ${contractEnd}</strong></td></tr>
                <tr><th>시공/시행사</th><td>${construct}</td></tr>
            </table>

            <div class="expert-box">
                <div class="expert-box-title">📋 공인중개사·권리분석사 핵심 체크포인트</div>
                <ul class="expert-box-list">
                    ${checkPoints}
                </ul>
            </div>
        `;

        var assigned = getAssignedManager(name);
        var targetKakao = (assigned && assigned.kakao) ? assigned.kakao : "https://open.kakao.com/o/sg4ZB3Wi";
        var targetPhone = (assigned && assigned.phone) ? assigned.phone : "010-3974-7087";
        var managerBadge = (assigned && assigned.managerName)
            ? `<div style="font-size:12px; color:#1e40af; background:#eff6ff; padding:6px 10px; border-radius:6px; margin-bottom:8px; font-weight:bold; text-align:center;">👤 전담 안내: ${assigned.role ? assigned.role + " " : ""}${assigned.managerName}</div>`
            : "";

        html += `
        ${managerBadge}
        <div class="consult-group">
            <a href="${targetKakao}" target="_blank" class="btn-kakao">💬 카톡 1:1 잔여세대·권리상담</a>
            <a href="tel:${targetPhone}" class="btn-call">📞 현장 직통 전화상담</a>
        </div>
        <a href="${targetKakao}" target="_blank" class="btn-realty-full">🏢 전담 부동산 매물 · 전세/월세 상담</a>
        `;

        if (url) {
            html += `<a href="${url}" target="_blank" class="modal-btn-link">청약홈 원본 공고문 확인하기 ↗</a>`;
        }

        modalBody.innerHTML = html;
        modalOverlay.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modalOverlay').style.display = 'none';
    }

    function detectTitleRegionHint(name) {
        var norm = normalizeName(name);
        for (var i = 0; i < titleRegionHints.length; i++) {
            if (norm.indexOf(titleRegionHints[i].keyword) !== -1) {
                return titleRegionHints[i];
            }
        }
        return null;
    }

    function verifyAndFixRegionCoords(name, rawAddr, coords, callback) {
        var hint = detectTitleRegionHint(name);
        if (!hint) {
            callback(coords);
            return;
        }

        geocoder.coord2RegionCode(coords.getLng(), coords.getLat(), function(result, status) {
            if (status === kakao.maps.services.Status.OK && result.length > 0) {
                var regionFull = result[0].address_name || "";
                if (regionFull.indexOf(hint.expectedRegion) === -1) {
                    places.keywordSearch(hint.fallbackQuery + " " + name, function(pData, pStatus) {
                        var validPlace = (pStatus === kakao.maps.services.Status.OK)
                            ? pData.find(function(item) {
                                return (item.address_name || "").indexOf(hint.expectedRegion) !== -1 &&
                                       (item.place_name || "").indexOf("모델하우스") === -1 &&
                                       (item.place_name || "").indexOf("견본주택") === -1;
                            })
                            : null;

                        if (validPlace) {
                            callback(new kakao.maps.LatLng(validPlace.y, validPlace.x));
                        } else {
                            geocoder.addressSearch(hint.fallbackQuery, function(gRes, gStatus) {
                                if (gStatus === kakao.maps.services.Status.OK) {
                                    callback(new kakao.maps.LatLng(gRes[0].y, gRes[0].x));
                                } else {
                                    callback(new kakao.maps.LatLng(hint.fallbackLat, hint.fallbackLng));
                                }
                            });
                        }
                    });
                    return;
                }
            }
            callback(coords);
        });
    }

    function findAccurateCoords(name, rawAddr, callback) {
        var normName = normalizeName(name);
        var combinedText = normName + "_" + normalizeName(rawAddr);
        var hint = detectTitleRegionHint(name);

        // 0순위-1: 엄궁 트라비스 예외 고정
        if (normName.indexOf("트라비스") !== -1 || normName.indexOf("트래비스") !== -1) {
            callback(new kakao.maps.LatLng(35.1268, 128.9710));
            return;
        }

        // 0순위-2: 부산 강서구(명지·에코델타시티) 실측 좌표 14곳 정위치 매핑
        if (!hint && (rawAddr.indexOf("강서구") !== -1 || normName.indexOf("에코델타") !== -1 || normName.indexOf("부산명지") !== -1)) {
            for (var i = 0; i < gangseoExactCoords.length; i++) {
                var entry = gangseoExactCoords[i];
                for (var j = 0; j < entry.keywords.length; j++) {
                    if (combinedText.indexOf(entry.keywords[j]) !== -1) {
                        callback(new kakao.maps.LatLng(entry.lat, entry.lng));
                        return;
                    }
                }
            }
        }

        // 1순위: 공급위치 정식 지번/도로명 주소 지오코딩 -> 행정구역 검증 통과
        var searchAddr = cleanAddress(rawAddr);
        geocoder.addressSearch(searchAddr, function(result, addrStatus) {
            if (addrStatus === kakao.maps.services.Status.OK) {
                var rawCoords = new kakao.maps.LatLng(result[0].y, result[0].x);
                verifyAndFixRegionCoords(name, rawAddr, rawCoords, callback);
            } else {
                var regionPrefix = hint ? hint.fallbackQuery : rawAddr.split(" ").slice(0, 2).join(" ");
                var keyword = regionPrefix + " " + name;

                places.keywordSearch(keyword, function(data, status) {
                    var filtered = (status === kakao.maps.services.Status.OK)
                        ? data.filter(function(item) {
                            var pName = item.place_name || "";
                            return pName.indexOf("모델하우스") === -1 &&
                                   pName.indexOf("견본주택") === -1 &&
                                   pName.indexOf("홍보관") === -1 &&
                                   pName.indexOf("분양사무소") === -1;
                        })
                        : [];

                    if (filtered.length > 0) {
                        var kwCoords = new kakao.maps.LatLng(filtered[0].y, filtered[0].x);
                        verifyAndFixRegionCoords(name, rawAddr, kwCoords, callback);
                    } else if (hint) {
                        callback(new kakao.maps.LatLng(hint.fallbackLat, hint.fallbackLng));
                    } else {
                        var shortAddr = searchAddr.split(" ").slice(0, 3).join(" ");
                        if (shortAddr) {
                            geocoder.addressSearch(shortAddr, function(retryRes, retryStatus) {
                                if (retryStatus === kakao.maps.services.Status.OK) {
                                    callback(new kakao.maps.LatLng(retryRes[0].y, retryRes[0].x));
                                } else {
                                    callback(null);
                                }
                            });
                        } else {
                            callback(null);
                        }
                    }
                });
            }
        });
    }

    var serviceKey = "935de5c23598a914dd97149a0b92614db7f4de28d991d658d58dfaca03bad3a7";
    var baseUrl = "https://api.odcloud.kr/api/ApplyhomeInfoDetailSvc/v1/getAPTLttotPblancDetail?perPage=1000&serviceKey=" + encodeURIComponent(serviceKey);

    Promise.all([
        fetch(baseUrl + "&page=1").then(function(r) { return r.json(); }),
        fetch(baseUrl + "&page=2").then(function(r) { return r.json(); }),
        fetch(baseUrl + "&page=3").then(function(r) { return r.json(); })
    ])
    .then(function(results) {
        var rawItems = [];
        results.forEach(function(res) {
            if (res && res.data) rawItems = rawItems.concat(res.data);
        });

        var seenPblanc = new Set();
        var uniqueItems = rawItems.filter(function(apt) {
            if (!isWithinFourYears(apt)) return false;
            var key = apt.PBLANC_NO || (apt.HOUSE_NM + "_" + apt.RCRIT_PBLANC_DE);
            if (seenPblanc.has(key)) return false;
            seenPblanc.add(key);
            return true;
        });

        var busanGyeongnamItems = uniqueItems.filter(function(apt) {
            return matchRegion(apt.HSSPLY_ADRES, 'busan');
        });

        var seoulItems = uniqueItems
            .filter(function(apt) {
                return !matchRegion(apt.HSSPLY_ADRES, 'busan') && matchRegion(apt.HSSPLY_ADRES, 'seoul');
            })
            .sort(function(a, b) {
                return (parseInt(b.TOT_SUPLY_HSHLDCO, 10) || 0) - (parseInt(a.TOT_SUPLY_HSHLDCO, 10) || 0);
            })
            .slice(0, 100);

        var etcItems = uniqueItems
            .filter(function(apt) {
                return !matchRegion(apt.HSSPLY_ADRES, 'busan') && !matchRegion(apt.HSSPLY_ADRES, 'seoul');
            })
            .sort(function(a, b) {
                return (parseInt(b.TOT_SUPLY_HSHLDCO, 10) || 0) - (parseInt(a.TOT_SUPLY_HSHLDCO, 10) || 0);
            })
            .slice(0, 40);

        var items = busanGyeongnamItems.concat(seoulItems).concat(etcItems);

        var existingNames = new Set(items.map(function(i) { return normalizeName(i.HOUSE_NM); }));
        mustIncludeList.forEach(function(extra) {
            if (isWithinFourYears(extra) && !existingNames.has(normalizeName(extra.HOUSE_NM))) {
                items.unshift(extra);
            }
        });

        var validItems = items.filter(function(apt) { return !!apt.HSSPLY_ADRES; });
        totalTargetCount = validItems.length;
        document.getElementById('status').innerText = "최근 4년 " + totalTargetCount + "건 로드 중...";

        validItems.forEach(function(apt, idx) {
            var name = apt.HOUSE_NM || "아파트명 미제공";
            var rawAddr = apt.HSSPLY_ADRES;
            var contractEnd = apt.CNTRCT_CNCLS_ENDDE || "";

            var statusType = getAptStatus(contractEnd);
            var isFcfs = (statusType === 'fcfs' || statusType === 'check' || statusType === 'old');
            var badgeText = statusType === 'apt' ? "실시간 청약"
                          : statusType === 'fcfs' ? "선착순 계약 (잔여·마감 확인)"
                          : statusType === 'old' ? "입주완료 · 매물/전월세 상담"
                          : "⚠️ 1년 경과·분양마감 확인필요";
            var badgeClass = statusType === 'apt' ? "badge-apt"
                           : statusType === 'fcfs' ? "badge-fcfs"
                           : statusType === 'old' ? "badge-old"
                           : "badge-check";
            var descText = statusType === 'apt'
                ? "접수: " + (apt.RCEPT_BGNDE || "-") + " ~ " + (apt.RCEPT_ENDDE || "-")
                : "정당계약 마감 (" + contractEnd + ")";

            setTimeout(function() {
                findAccurateCoords(name, rawAddr, function(coords) {
                    loadedCount++;
                    if (coords) {
                        renderClickableMarker(coords, badgeText, badgeClass, name, descText, apt, statusType, isFcfs, rawAddr);
                    }
                    applyFilters();
                });
            }, idx * 100);
        });
    })
    .catch(function(err) {
        console.error(err);
        document.getElementById('status').innerText = "API 연결 대기 중";
    });

    function renderClickableMarker(position, badgeText, badgeClass, title, desc, aptData, statusType, isFcfs, rawAddr) {
        var regionMatch = matchRegion(rawAddr, currentRegion);
        var typeMatch = (currentFilter === 'all') ||
                        (currentFilter === 'fcfs' && isFcfs) ||
                        (currentFilter === 'apt' && !isFcfs);
        var shouldShow = regionMatch && typeMatch;

        var marker = new kakao.maps.Marker({
            map: shouldShow ? map : null,
            position: position
        });

        var content = document.createElement('div');
        content.className = 'info-box';
        content.innerHTML = `
            <span class="badge ${badgeClass}">${badgeText}</span>
            <div class="title">${title}</div>
            <div class="desc">${desc}</div>
            <div class="click-hint">클릭 시 체크포인트·상담 👆</div>
        `;

        content.onclick = function() {
            openModal(aptData, statusType);
        };
        kakao.maps.event.addListener(marker, 'click', function() {
            openModal(aptData, statusType);
        });

        var overlay = new kakao.maps.CustomOverlay({
            map: shouldShow ? map : null,
            position: position,
            content: content,
            yAnchor: 1.3
        });

        allMarkerItems.push({
            marker: marker,
            overlay: overlay,
            isFcfs: isFcfs,
            addr: rawAddr
        });
    }
